<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request a Print – Toker Trav’s Prints</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-art"></div>

<nav class="nav">
  <div class="nav-inner">
    <a class="logo" href="index.html">Toker Trav’s Prints</a>
    <div class="nav-links">
      <a href="product.html">Products</a>
      <a href="pricing.html">Pricing</a>
      <a href="about.html">About</a>
    </div>
  </div>
</nav>

<header class="hero small">
  <h1>Request a Custom Print</h1>
  <p>A rough idea is more than enough to start.</p>
</header>

<section class="section">
  <form class="quote-form" onsubmit="event.preventDefault(); alert('Demo only – submissions disabled');">
    
    <label>
      Name
      <input type="text" required>
    </label>

    <label>
      Email
      <input type="email" required>
    </label>

    <label>
      Describe the part
      <textarea rows="5"></textarea>
    </label>

    <label>
      Material preference
      <select>
        <option>Not sure</option>
        <option>PLA</option>
        <option>PETG</option>
        <option>TPU</option>
      </select>
    </label>

    <label>
      File upload (coming soon)
      <input type="file" disabled>
    </label>

    <button class="cta" type="submit">Request Quote</button>

    <p class="form-note">
      This form is a demo. Submissions will be enabled when the site goes live.
    </p>

  </form>
</section>

<footer>
  <a href="index.html">← Back to Home</a>
</footer>

<script src="main.js"></script>
</body>
</html>
